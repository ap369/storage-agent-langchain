<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>storage-agent</title>
  <link rel="stylesheet" href="/web/style.css?v=4">
  <script src="/web/vendor/marked.min.js"></script>
  <script src="/web/vendor/purify.min.js"></script>
</head>
<body>
  <div id="sidebar">
    <h2>MCP Status</h2>
    <div id="mcp-status">Loading…</div>
  </div>
  <div id="main">
    <div id="messages"></div>
    <div id="thinking" class="hidden">thinking…</div>
    <form id="chat-form">
      <input id="chat-input" type="text" autocomplete="off" placeholder="Ask storage-agent…">
      <button type="submit">Send</button>
    </form>
  </div>
  <div id="files-panel">
    <h2>Files</h2>
    <div class="files-actions">
      <button id="new-folder" type="button">New folder</button>
      <button id="upload-button" type="button">Upload</button>
      <input id="upload-input" type="file" multiple hidden>
    </div>
    <div id="files-path"></div>
    <ul id="files-list"></ul>
  </div>
  <script src="/web/chat.js?v=5"></script>
</body>
</html>
